spring:
  application:
    name: renaissance-data
  profiles:
    active: plain-text-logging,prd
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/renaissancedb}
    username: ${SPRING_DATASOURCE_USERNAME:renaissance}
    password: ${SPRING_DATASOURCE_PASSWORD:renaissancepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
  mvc:
    format:
      date-time: iso
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
otel:
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: none

renaissancerentals:
  error:
    notification:
      enabled: true
      email-to: contentmunch@gmail.com
      email-cc: contentmunch@gmail.com
      title-format: ?? Server Exception Alert - {0}
      excluded-server-exceptions:
        - com.renaissancerentals.mail.error.MailServerException
  logging:
    enabled: true
  telemetry:
    enabled: true
  mail:
    enabled: true
    client-id: ${GOOGLE_API_CLIENT_ID}
    client-secret: ${GOOGLE_API_CLIENT_SECRET}
    refresh-token: ${GOOGLE_API_REFRESH_TOKEN}
    token-server: https://oauth2.googleapis.com/token
    from: ${MAIL_FROM:renaissance.rentals.mail@gmail.com}
    cc: ${MAIL_CC:edainton@renaissancerentals.com}
    from-name: ${MAIL_FROM_NAME:Renaissance Rentals}
  assets:
    enabled: true
    clientId: ${GOOGLE_API_CLIENT_ID}
    clientSecret: ${GOOGLE_API_CLIENT_SECRET}
    refreshToken: ${GOOGLE_API_REFRESH_TOKEN}
    tokenServer: https://oauth2.googleapis.com/token
    defaultFolder: ${GOOGLE_DRIVE_FOLDER}
  sublet:
    alertTo: ${SUBLET_ALERT_TO:edainton@renaissancerentals.com}
    folder: ${GOOGLE_DRIVE_SUBLETS_FOLDER:1Aus9EfNfZ0p0mIr-2L484mIISlsrS4IX}
  text:
    enabled: true
    client-id: ${RENAISSANCE_TEXT_CLIENT_ID}
    client-secret: ${RENAISSANCE_TEXT_CLIENT_SECRET}
    jwt-token: ${RENAISSANCE_TEXT_JWT_TOKEN}
    server-url: https://platform.ringcentral.com

