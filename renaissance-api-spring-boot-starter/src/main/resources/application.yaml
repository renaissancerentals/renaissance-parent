spring:
  application:
    name: renaissance-data
  profiles:
    active: loki-logging,prd
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/renaissancedb}
    username: ${SPRING_DATASOURCE_USERNAME:renaissance}
    password: ${SPRING_DATASOURCE_PASSWORD:renaissancepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
  mvc:
    format:
      date-time: iso
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
otel:
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: none

renaissancerentals:
  error:
    notification:
      enabled: true
      email-to: contentmunch@gmail.com
      title-format: ⚠️Server Exception Alert - {0}
      excluded-server-exceptions:
        - com.renaissancerentals.mail.error.MailServerException
  logging:
    enabled: true
  telemetry:
    enabled: true
  mail:
    enabled: true
    client-id: ${GOOGLE_API_CLIENT_ID}
    client-secret: ${GOOGLE_API_CLIENT_SECRET}
    refresh-token: ${GOOGLE_API_REFRESH_TOKEN}
    token-server: https://oauth2.googleapis.com/token
    from: ${MAIL_FROM:renaissance.rentals.mail@gmail.com}
    cc: ${MAIL_CC:edainton@renaissancerentals.com}
    from-name: ${MAIL_FROM_NAME:Renaissance Rentals}
  property:
    default-property-email: ${DEAULT_PROPERTY_EMAIL:inquiries@renaissancerentals.com}
    default-property-phone: ${DEAULT_PROPERTY_PHONE:8123332280}
    default-property-manager: ${DEAULT_PROPERTY_MANAGER:Eric Dainton}
    default-property-url: https://www.renaissancerentals.com/
    property-urls:
      covenanter-hill: https://www.covenanterhill.com/
      high-grove: https://www.highgrovebloomington.com/
      renaissance-rentals: https://www.renaissancerentals.com/
      scholars-quad: https://www.scholarsquad.com/
      scholars-rooftop: https://www.scholarsrooftop.com/
      summer-house: https://www.summerhouseatindiana.com/
      verona-park: https://www.veronaparkneighborhood.com/
      apartments-in-bloomington: https://www.apartmentsinbloomington.com/
      bloomington-apartments: https://www.bloomingtonapartmentsavailablenow.com/
  assets:
    enabled: true
    clientId: ${GOOGLE_API_CLIENT_ID}
    clientSecret: ${GOOGLE_API_CLIENT_SECRET}
    refreshToken: ${GOOGLE_API_REFRESH_TOKEN}
    tokenServer: https://oauth2.googleapis.com/token
    defaultFolder: ${GOOGLE_DRIVE_FOLDER}
  sublet:
    alertTo: ${SUBLET_ALERT_TO:edainton@renaissancerentals.com}
    folder: ${GOOGLE_DRIVE_SUBLETS_FOLDER:1Aus9EfNfZ0p0mIr-2L484mIISlsrS4IX}
  text:
    enabled: true
    server-url: https://platform.ringcentral.com
    extensions:
      8123238021:
        name: Covenanter Hill
        phone-number: +18123238021
        client-id: ${RENAISSANCE_TEXT_COV_CLIENT_ID}
        client-secret: ${RENAISSANCE_TEXT_COV_CLIENT_SECRET}
        jwt-token: ${RENAISSANCE_TEXT_COV_JWT_TOKEN}
      8123301123:
        name: Scholars Rock
        phone-number: +18123301123
        client-id: ${RENAISSANCE_TEXT_SC_CLIENT_ID}
        client-secret: ${RENAISSANCE_TEXT_SC_CLIENT_SECRET}
        jwt-token: ${RENAISSANCE_TEXT_SC_JWT_TOKEN}
      8123322141:
        name: Summer House
        phone-number: +18123322141
        client-id: ${RENAISSANCE_TEXT_SH_CLIENT_ID}
        client-secret: ${RENAISSANCE_TEXT_SH_CLIENT_SECRET}
        jwt-token: ${RENAISSANCE_TEXT_SH_JWT_TOKEN}
      8123332280:
        name: Verona Park
        phone-number: +18123332280
        client-id: ${RENAISSANCE_TEXT_VP_CLIENT_ID}
        client-secret: ${RENAISSANCE_TEXT_VP_CLIENT_SECRET}
        jwt-token: ${RENAISSANCE_TEXT_VP_JWT_TOKEN}
logging:
  loki:
    url: http://localhost:3100/loki/api/v1/push
    app-name: ${spring.application.name}
    environment: prod
